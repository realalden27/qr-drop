<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Download {{FILENAME}} - qr-drop</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .filename {
      font-size: 1.25rem;
      font-weight: 600;
      word-break: break-all;
      margin-bottom: 0.5rem;
    }
    .filesize {
      color: var(--subtext);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: background-color 0.15s ease;
      border: none;
      cursor: pointer;
    }
    .btn:hover, .btn:active {
      background-color: var(--accent-hover);
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--subtext);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1 class="filename">{{FILENAME}}</h1>
    <div class="filesize">{{FILESIZE}}</div>
    <a href="{{DOWNLOAD_URL}}" class="btn" id="dl-btn" download>Download File</a>
    <div class="footer">Sent securely over local network via qr-drop</div>
  </div>
  <script>
    // Auto-trigger download after 600ms
    setTimeout(() => {
      document.getElementById('dl-btn').click();
    }, 600);
  </script>
</body>
</html>
